<title>Period Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: header + quick-add bar on top; below it a class list (sidebar on wide screens, scrolling strip on phones) beside the homework list grouped by due date. */
:root {
  --bg: #eef1f7;
  --surface: #ffffff;
  --fg: #141c33;
  --muted: #5a6580;
  --line: #d9deeb;
  --accent: #2c4fd6;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9fd;
  --danger: #c2273b;
  --danger-soft: #fbe6e9;
  --c1: #3b6ef0; --c2: #0f9d8a; --c3: #4a9b2f; --c4: #c98a0a;
  --c5: #d6404e; --c6: #b43fb0; --c7: #7a4fe0; --c8: #5b6b86;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1424; --surface: #171d33; --fg: #e8ecf8; --muted: #9aa5c3; --line: #2a3250;
    --accent: #8da4ff; --accent-ink: #0f1424; --accent-soft: #222b52;
    --danger: #ff8091; --danger-soft: #3a1f29;
    --c1: #7c9bff; --c2: #3ccbb6; --c3: #8fd16a; --c4: #f0b942;
    --c5: #ff7a85; --c6: #e47fe0; --c7: #ab8cff; --c8: #9db0cc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1424; --surface: #171d33; --fg: #e8ecf8; --muted: #9aa5c3; --line: #2a3250;
  --accent: #8da4ff; --accent-ink: #0f1424; --accent-soft: #222b52;
  --danger: #ff8091; --danger-soft: #3a1f29;
  --c1: #7c9bff; --c2: #3ccbb6; --c3: #8fd16a; --c4: #f0b942;
  --c5: #ff7a85; --c6: #e47fe0; --c7: #ab8cff; --c8: #9db0cc;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 22px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* header */
.top { display: flex; flex-direction: column; gap: 10px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
.today { color: var(--muted); font-size: 15px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { font-size: 13px; font-weight: 500; padding: 4px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.stat.bad { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.stat.warn { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

/* quick add */
.add { display: flex; flex-wrap: wrap; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.add > * { min-width: 0; }
.field { height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 12px; }
#title { flex: 1 1 240px; }
#cls { flex: 1 1 150px; }
#due { flex: 1 1 150px; font-variant-numeric: tabular-nums; }
.btn { height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; flex: 0 0 auto; }
.btn:hover { filter: brightness(1.06); }
.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); height: 34px; padding: 0 12px; border-radius: 9px; font-size: 14px; font-weight: 500; }
.ghost:hover { background: var(--accent-soft); }

/* class nav + panel */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.navbtn { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; padding: 10px 12px; border-radius: 11px; border: 1px solid transparent; background: transparent; text-align: left; white-space: nowrap; }
.navbtn:hover { background: var(--accent-soft); }
.navbtn[aria-current="true"] { background: var(--surface); border-color: var(--line); font-weight: 600; }
.dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
.alldot { background: var(--fg); }
.count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.2em; text-align: right; padding-left: 6px; }
.navbtn[aria-current="true"] .count { color: var(--fg); }
@media (min-width: 760px) {
  .layout { grid-template-columns: 230px minmax(0, 1fr); }
  .nav { flex-direction: column; overflow: visible; padding-bottom: 0; position: sticky; top: 16px; }
  .navbtn { width: 100%; }
  .navsep { height: 1px; background: var(--line); margin: 4px 8px; }
}
.navsep { display: none; }
@media (min-width: 760px) { .navsep { display: block; } }

.panel { min-width: 0; }
.panel-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
.panel-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 0; line-height: 1.2; }
.panel-head .dot { width: 14px; height: 14px; }
.rename { height: 38px; font-family: var(--font-display); font-weight: 600; font-size: 20px; width: min(100%, 260px); }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 6px; }

.sec { margin-top: 20px; }
.sec h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.sec h3 .n { font-variant-numeric: tabular-nums; font-weight: 500; }
.sec.late h3 { color: var(--danger); }
ul.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
li.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.check { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--muted); background: transparent; display: grid; place-items: center; padding: 0; color: var(--accent-ink); transition: background 0.12s, border-color 0.12s; }
.check:hover { border-color: var(--accent); }
.check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.check svg { opacity: 0; }
.check[aria-checked="true"] svg { opacity: 1; }
.ttl { font-weight: 500; overflow-wrap: anywhere; padding-top: 3px; }
.done .ttl { text-decoration: line-through; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.due { font-variant-numeric: tabular-nums; }
.due.late { color: var(--danger); background: var(--danger-soft); padding: 1px 8px; border-radius: 999px; font-weight: 500; }
.due.soon { color: var(--accent); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; }
.chip .dot { width: 9px; height: 9px; }
.del { width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; }
.del:hover { background: var(--danger-soft); color: var(--danger); }

.empty { margin-top: 14px; padding: 26px 18px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 18px; font-weight: 600; margin-bottom: 4px; }

.donebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 22px; }

.foot { color: var(--muted); font-size: 12.5px; margin-top: 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 10px 10px 16px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,0.25); z-index: 20; }
.toast button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; padding: 5px 12px; font-weight: 600; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Period Planner</h1>
    <div class="today" id="today"></div>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>

  <form class="add" id="add" autocomplete="off">
    <input class="field" id="title" type="text" maxlength="140" placeholder="What's due? e.g. Chapter 4 questions" aria-label="Homework">
    <select class="field" id="cls" aria-label="Class"></select>
    <input class="field" id="due" type="date" aria-label="Due date">
    <button class="btn" type="submit">Add</button>
  </form>

  <div class="layout">
    <nav class="nav" id="nav" aria-label="Classes"></nav>
    <main class="panel" id="panel"></main>
  </div>
  <div class="foot" id="status"></div>
</div>

<div class="toast" id="toast" hidden><span id="toastmsg"></span><button type="button" id="undo">Undo</button></div>

<script>
(function () {
  var LS = "hw-planner-v1", LSV = "hw-planner-view";
  var DEFAULT_CLASSES = ["Period 1", "Period 2", "Period 3", "Period 4", "Period 5", "Period 6", "Period 7", "Period 8"];
  var OLD_DEFAULTS = ["Math", "English", "Science", "Social Studies", "Spanish", "PE", "Art", "Technology"];
  function migrate(s) {
    if (s && Array.isArray(s.classes) && s.classes.length === 8 && s.classes.every(function (c, i) { return c.name === OLD_DEFAULTS[i]; })) {
      s.classes.forEach(function (c, i) { c.name = DEFAULT_CLASSES[i]; });
    }
    return s;
  }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function valid(p) { return p && Array.isArray(p.classes) && p.classes.length === 8 && Array.isArray(p.tasks); }
  function fresh() {
    return { classes: DEFAULT_CLASSES.map(function (n, i) { return { id: "c" + (i + 1), name: n }; }), tasks: [], updated: 0 };
  }

  var state = fresh();
  try { var raw = lsGet(LS); if (raw) { var p = JSON.parse(raw); if (valid(p)) state = migrate(p); } } catch (e) {}
  var view = lsGet(LSV) || "all";
  var renaming = false, showDone = false, lastRemoved = null, toastTimer = null;

  function $(id) { return document.getElementById(id); }
  function classById(id) { return state.classes.filter(function (c) { return c.id === id; })[0]; }
  function classIndex(id) { for (var i = 0; i < state.classes.length; i++) if (state.classes[i].id === id) return i; return 0; }
  function colorOf(id) { return "var(--c" + (classIndex(id) + 1) + ")"; }
  function fixView() { if (view !== "all" && !classById(view)) view = "all"; }
  fixView();

  function h(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      e.append(c.nodeType ? c : document.createTextNode(c));
    }
    return e;
  }
  function icon(d, size) {
    var s = document.createElement("span");
    s.innerHTML = '<svg viewBox="0 0 16 16" width="' + size + '" height="' + size + '" aria-hidden="true"><path d="' + d + '" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return s.firstChild;
  }

  /* dates */
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function dayDiff(str) { var a = str.split("-").map(Number); return Math.round((new Date(a[0], a[1] - 1, a[2]) - today()) / 864e5); }
  function fmt(str) { var a = str.split("-").map(Number); return new Date(a[0], a[1] - 1, a[2]).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }
  function dueInfo(t) {
    if (!t.due) return null;
    var d = dayDiff(t.due);
    if (t.done) return { text: fmt(t.due), cls: "" };
    if (d < 0) return { text: fmt(t.due) + " · " + (-d) + (d === -1 ? " day late" : " days late"), cls: "late" };
    if (d === 0) return { text: "Due today", cls: "soon" };
    if (d === 1) return { text: "Due tomorrow", cls: "soon" };
    return { text: "Due " + fmt(t.due), cls: "" };
  }
  function bucket(t) {
    if (!t.due) return 5;
    var d = dayDiff(t.due);
    if (d < 0) return 0; if (d === 0) return 1; if (d === 1) return 2; if (d < 7) return 3; return 4;
  }
  var BUCKETS = ["Overdue", "Due today", "Due tomorrow", "This week", "Later", "No due date"];
  function byDue(a, b) {
    if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
    if (a.due && !b.due) return -1;
    if (!a.due && b.due) return 1;
    return (a.t || 0) - (b.t || 0);
  }

  /* saving: this device always, your account when connected */
  var docRef = null, writeTimer = null, writing = false, dirty = false, synced = false;
  function setStatus() {
    $("status").textContent = synced ? "Saved to your Claude account. Open this page on any device where you're signed in." : (window.claude ? "Saved on this device only. Sign in to Claude to save it to your account." : "Saved in this browser on this device.");
  }
  function save() {
    state.updated = Date.now();
    lsSet(LS, JSON.stringify(state));
    if (docRef) { dirty = true; clearTimeout(writeTimer); writeTimer = setTimeout(flush, 500); }
  }
  function flush() {
    if (writing || !docRef || !dirty) return;
    writing = true; dirty = false;
    docRef.set({ classes: state.classes, tasks: state.tasks, updated: state.updated }).then(function () {
      synced = true; setStatus();
    }, function () {
      synced = false; setStatus();
    }).then(function () {
      writing = false;
      if (dirty) writeTimer = setTimeout(flush, 200);
    });
  }
  function connect() {
    if (!window.claude || !window.claude.use) return;
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (id) {
        if (!id) return;
        docRef = db.doc("data/users/" + id + "/homework");
        docRef.onSnapshot(function (snap) {
          if (snap.metadata.hasPendingWrites) return;
          var d = snap.exists ? snap.data() : null;
          if (d && valid(d) && (d.updated || 0) > (state.updated || 0)) {
            state = migrate(JSON.parse(JSON.stringify(d)));
            lsSet(LS, JSON.stringify(state));
            fixView(); renderAll(); renderOptions();
          } else if (state.updated && (!d || (d.updated || 0) < state.updated)) {
            dirty = true; flush();
          }
          synced = true; setStatus();
        }, function () { synced = false; setStatus(); });
      });
    }).catch(function () {});
  }

  /* actions */
  function setView(v) {
    view = v; renaming = false; lsSet(LSV, v);
    if (v !== "all") $("cls").value = v;
    renderAll();
  }
  function toggle(t) { t.done = !t.done; save(); renderAll(); }
  function removeTasks(list, msg) {
    var ids = {}; list.forEach(function (t) { ids[t.id] = 1; });
    state.tasks = state.tasks.filter(function (t) { return !ids[t.id]; });
    lastRemoved = list; save(); renderAll();
    $("toastmsg").textContent = msg; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { $("toast").hidden = true; }, 7000);
  }
  $("undo").addEventListener("click", function () {
    if (lastRemoved) { state.tasks = state.tasks.concat(lastRemoved); lastRemoved = null; save(); renderAll(); }
    $("toast").hidden = true;
  });
  function commitRename(input) {
    if (!renaming) return;
    renaming = false;
    var c = classById(view), v = input.value.trim().slice(0, 24);
    if (c && v && v !== c.name) { c.name = v; save(); }
    renderAll(); renderOptions();
  }

  /* render */
  function openTasks() { return state.tasks.filter(function (t) { return !t.done; }); }
  function renderStats() {
    var o = openTasks();
    var late = o.filter(function (t) { return t.due && dayDiff(t.due) < 0; }).length;
    var td = o.filter(function (t) { return t.due && dayDiff(t.due) === 0; }).length;
    var s = $("stats"); s.replaceChildren();
    s.append(h("span", { class: "stat", text: o.length + " to do" }));
    if (late) s.append(h("span", { class: "stat bad", text: late + " overdue" }));
    if (td) s.append(h("span", { class: "stat warn", text: td + " due today" }));
    $("today").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  }
  function renderNav() {
    var nav = $("nav"); nav.replaceChildren();
    var o = openTasks();
    function btn(id, label, dotEl, n) {
      return h("button", { class: "navbtn", type: "button", "aria-current": view === id ? "true" : "false", onclick: function () { setView(id); } },
        dotEl, h("span", { text: label }), h("span", { class: "count", text: n ? String(n) : "" }));
    }
    nav.append(btn("all", "Everything", h("span", { class: "dot alldot" }), o.length));
    nav.append(h("div", { class: "navsep" }));
    state.classes.forEach(function (c) {
      var n = o.filter(function (t) { return t.cls === c.id; }).length;
      var d = h("span", { class: "dot" }); d.style.background = colorOf(c.id);
      nav.append(btn(c.id, c.name, d, n));
    });
  }
  function renderOptions() {
    var sel = $("cls"), cur = sel.value || (view !== "all" ? view : state.classes[0].id);
    sel.replaceChildren();
    state.classes.forEach(function (c) { sel.append(h("option", { value: c.id, text: c.name })); });
    sel.value = classById(cur) ? cur : state.classes[0].id;
  }
  function taskRow(t, showClass) {
    var info = dueInfo(t), c = classById(t.cls);
    var meta = h("div", { class: "meta" });
    if (info) meta.append(h("span", { class: "due " + info.cls, text: info.text }));
    if (showClass && c) {
      var d = h("span", { class: "dot" }); d.style.background = colorOf(c.id);
      meta.append(h("span", { class: "chip" }, d, c.name));
    }
    var chk = h("button", { class: "check", type: "button", role: "checkbox", "aria-checked": t.done ? "true" : "false", "aria-label": "Mark done: " + t.title, onclick: function () { toggle(t); } });
    chk.append(icon("M3 8.5l3.2 3.2L13 5", 15));
    var del = h("button", { class: "del", type: "button", "aria-label": "Delete: " + t.title, onclick: function () { removeTasks([t], "Deleted “" + (t.title.length > 28 ? t.title.slice(0, 28) + "…" : t.title) + "”"); } });
    del.append(icon("M4 4l8 8M12 4l-8 8", 14));
    return h("li", { class: "task" + (t.done ? " done" : "") }, chk, h("div", null, h("div", { class: "ttl", text: t.title }), meta), del);
  }
  function renderMain() {
    var panel = $("panel"); panel.replaceChildren();
    var isAll = view === "all", c = isAll ? null : classById(view);
    var scope = state.tasks.filter(function (t) { return isAll || t.cls === view; });
    var open = scope.filter(function (t) { return !t.done; }).sort(byDue);
    var done = scope.filter(function (t) { return t.done; }).sort(byDue);

    var head = h("div", { class: "panel-head" });
    var renameInput = null;
    if (isAll) {
      head.append(h("h2", { text: "Everything" }));
    } else {
      var d = h("span", { class: "dot" }); d.style.background = colorOf(c.id);
      head.append(d);
      if (renaming) {
        renameInput = h("input", { class: "field rename", type: "text", maxlength: "24", value: c.name, "aria-label": "Class name",
          onkeydown: function (e) { if (e.key === "Enter") commitRename(e.target); if (e.key === "Escape") { renaming = false; renderAll(); } },
          onblur: function (e) { commitRename(e.target); } });
        head.append(renameInput);
      } else {
        head.append(h("h2", { text: c.name }), h("button", { class: "ghost", type: "button", onclick: function () { renaming = true; renderMain(); } }, "Rename"));
      }
    }
    panel.append(head);
    panel.append(h("p", { class: "sub", text: open.length ? (open.length + (open.length === 1 ? " assignment" : " assignments") + " left, soonest first") : "" }));

    if (!open.length) {
      panel.append(h("div", { class: "empty" },
        h("strong", { text: isAll ? "No homework yet" : "Nothing due for " + c.name },
        ), isAll ? "Type the assignment above, pick the class and a due date, then press Add." : "Add an assignment above and it shows up here."));
    } else {
      for (var b = 0; b < 6; b++) {
        var items = open.filter(function (t) { return bucket(t) === b; });
        if (!items.length) continue;
        var ul = h("ul", { class: "tasks" });
        items.forEach(function (t) { ul.append(taskRow(t, isAll)); });
        panel.append(h("section", { class: "sec" + (b === 0 ? " late" : "") },
          h("h3", null, BUCKETS[b], h("span", { class: "n", text: String(items.length) })), ul));
      }
    }

    if (done.length) {
      var bar = h("div", { class: "donebar" },
        h("button", { class: "ghost", type: "button", "aria-expanded": showDone ? "true" : "false", onclick: function () { showDone = !showDone; renderMain(); } }, (showDone ? "Hide done" : "Show done") + " (" + done.length + ")"),
        h("button", { class: "ghost", type: "button", onclick: function () { removeTasks(done, "Cleared " + done.length + " finished"); } }, "Clear done"));
      panel.append(bar);
      if (showDone) {
        var dl = h("ul", { class: "tasks", style: "margin-top:10px" });
        done.forEach(function (t) { dl.append(taskRow(t, isAll)); });
        panel.append(dl);
      }
    }
    if (renameInput) { renameInput.focus(); renameInput.select(); }
  }
  function renderAll() { renderStats(); renderNav(); renderMain(); }

  /* add form */
  $("add").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = $("title").value.trim();
    if (!title) { $("title").focus(); return; }
    var cls = $("cls").value;
    state.tasks.push({ id: Math.random().toString(36).slice(2, 9) + Date.now().toString(36), cls: cls, title: title, due: $("due").value || "", done: false, t: Date.now() });
    $("title").value = ""; $("due").value = "";
    save();
    if (view !== "all") { view = cls; lsSet(LSV, view); }
    renderAll();
    $("title").focus();
  });

  renderOptions();
  if (view !== "all") $("cls").value = view;
  renderAll();
  setStatus();
  connect();
})();
</script>
